name: Build V2rayNG APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;37.0.0'
          accept-android-sdk-licenses: true
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease -x lintVitalReportFdroidRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
